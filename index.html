<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NumberPath</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen { display: none; width: 100%; max-width: 560px; padding: 16px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* Title Screen */
  #screen-title { justify-content: center; min-height: 100vh; gap: 40px; }
  .game-title { font-size: 48px; font-weight: 800; letter-spacing: -2px; color: #1a1a1a; }
  .game-subtitle { font-size: 16px; color: #666; margin-top: -30px; }
  .btn-play {
    background: #1a1a1a; color: #fff; border: none; border-radius: 12px;
    padding: 16px 48px; font-size: 20px; font-weight: 700;
    cursor: pointer; letter-spacing: 2px; transition: transform 0.1s, background 0.1s;
  }
  .btn-play:hover { background: #333; transform: scale(1.04); }

  /* Game Screen */
  #screen-game { min-height: 100vh; justify-content: space-between; padding: 12px 16px; }
  .game-header {
    display: flex; align-items: center; width: 100%; margin-bottom: 8px;
  }
  .btn-back {
    background: none; border: 2px solid #ccc; border-radius: 8px;
    padding: 8px 14px; font-size: 18px; cursor: pointer; color: #555;
    transition: border-color 0.1s;
  }
  .btn-back:hover { border-color: #888; }
  .game-header-title { flex: 1; text-align: center; font-size: 22px; font-weight: 700; color: #1a1a1a; }

  /* Grid */
  .grid-wrapper { position: relative; margin: 8px 0; }
  #grid {
    display: grid;
    grid-template-columns: repeat(8, 60px);
    grid-template-rows: repeat(8, 60px);
    gap: 2px;
    background: #d1d5db;
    border: 2px solid #d1d5db;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    user-select: none;
    touch-action: none;
  }
  .cell {
    width: 60px; height: 60px;
    background: #fff;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.08s;
  }
  .cell.filled { background: #e5e7eb; }
  .cell.filled-node { background: #e5e7eb; }

  /* Node circles */
  .node-circle {
    width: 40px; height: 40px; border-radius: 50%;
    background: #1a1a1a; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    z-index: 2; position: relative; pointer-events: none;
    transition: background 0.15s;
  }
  .cell.current-target .node-circle { background: #c084fc; }

  /* Path connector lines */
  .path-line {
    position: absolute; background: #9ca3af; z-index: 1; pointer-events: none;
  }
  .path-line.h  { width: 100%; height: 8px; top: 50%; transform: translateY(-50%); left: 0; }
  .path-line.v  { height: 100%; width: 8px; left: 50%; transform: translateX(-50%); top: 0; }
  .path-line.half-r { width: 50%; height: 8px; top: 50%; transform: translateY(-50%); right: 0; left: auto; }
  .path-line.half-l { width: 50%; height: 8px; top: 50%; transform: translateY(-50%); left: 0; }
  .path-line.half-d { height: 50%; width: 8px; left: 50%; transform: translateX(-50%); bottom: 0; top: auto; }
  .path-line.half-u { height: 50%; width: 8px; left: 50%; transform: translateX(-50%); top: 0; }

  /* Maze walls */
  .game-wall {
    position: absolute;
    background: #1a1a1a;
    z-index: 5;
    pointer-events: none;
    border-radius: 2px;
  }

  /* Buttons */
  .game-footer { display: flex; gap: 12px; width: 100%; margin-top: 8px; }
  .btn-action {
    flex: 1; background: #fff; border: 2px solid #d1d5db; border-radius: 12px;
    padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
    color: #374151; transition: background 0.1s, border-color 0.1s;
  }
  .btn-action:hover { background: #f3f4f6; border-color: #9ca3af; }

  /* Clear overlay */
  #clear-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(255,255,255,0.92);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; border-radius: 4px; z-index: 10;
  }
  #clear-overlay.show { display: flex; }
  .clear-text { font-size: 40px; font-weight: 800; color: #1a1a1a; }
  .clear-buttons { display: flex; gap: 12px; }
  .btn-next {
    background: #1a1a1a; color: #fff; border: none; border-radius: 12px;
    padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: background 0.1s;
  }
  .btn-next:hover { background: #333; }
  .btn-retry {
    background: #6b7280;
  }
  .btn-retry:hover { background: #4b5563; }

  /* Hint highlight */
  @keyframes hintPulse {
    0%   { box-shadow: inset 0 0 0 0   #fbbf24, inset 0 0 0 0   #fde68a; }
    40%  { box-shadow: inset 0 0 0 30px #fbbf24, inset 0 0 0 30px #fde68a; }
    100% { box-shadow: inset 0 0 0 30px #fbbf24, inset 0 0 0 30px #fde68a; }
  }
  .cell.hint-show {
    animation: hintPulse 0.4s ease forwards;
    background: #fde68a !important;
    z-index: 3;
  }

  #progress-counter {
    font-size: 13px; color: #9ca3af; margin: 4px 0; letter-spacing: 0.5px;
    min-height: 18px; text-align: center; transition: color 0.2s;
  }
  #progress-counter.hint-fail { color: #ef4444; }

  .btn-action:disabled { opacity: 0.6; cursor: default; }

  @media (max-width: 520px) {
    #grid {
      grid-template-columns: repeat(8, calc((100vw - 48px) / 8));
      grid-template-rows: repeat(8, calc((100vw - 48px) / 8));
    }
    .cell { width: 100%; height: 100%; }
    .node-circle { width: 36px; height: 36px; font-size: 14px; }
    .clear-buttons { flex-direction: column; align-items: center; }
  }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="screen-title" class="screen active">
  <div class="game-title">NumberPath</div>
  <div class="game-subtitle">数字を順番に繋いで全マスを埋めよう</div>
  <button class="btn-play" id="btn-play">PLAY</button>
</div>

<!-- Game Screen -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <button class="btn-back" id="btn-back">←</button>
    <div class="game-header-title">NumberPath</div>
    <div style="width:52px"></div>
  </div>
  <div class="grid-wrapper">
    <div id="grid"></div>
    <div id="clear-overlay">
      <div class="clear-text">クリア！ 🎉</div>
      <div class="clear-buttons">
        <button class="btn-next btn-retry" id="btn-retry">もう一度</button>
        <button class="btn-next" id="btn-different">別のパターン</button>
      </div>
    </div>
  </div>
  <div id="progress-counter">0 / 64</div>
  <div class="game-footer">
    <button class="btn-action" id="btn-undo">🔄 リセット</button>
    <button class="btn-action" id="btn-hint">💡 ヒント</button>
  </div>
</div>

<script>
// ===================== WALL HELPERS =====================
const B  = (r,c)       => ({row:r, col:c, side:'bottom'});
const R  = (r,c)       => ({row:r, col:c, side:'right'});
const HW = (r,c1,c2)   => { const a=[]; for(let c=c1;c<=c2;c++) a.push(B(r,c)); return a; };
const VW = (r1,r2,c)   => { const a=[]; for(let r=r1;r<=r2;r++) a.push(R(r,c)); return a; };

// ===================== PUZZLE DATA =====================
const PUZZLES = [
  // 1: corners — snake (no walls, tutorial)
  { id:1, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:0,col:7},{num:3,row:7,col:7},{num:4,row:7,col:0}],
    borders:[]
  },
  // 2: inner corners — vertical pillars with gap
  { id:2, grid:8,
    nodes:[{num:1,row:1,col:1},{num:2,row:1,col:6},{num:3,row:6,col:6},{num:4,row:6,col:1}],
    borders:[
      ...VW(0,2,2), ...VW(5,7,2),
      ...VW(0,2,5), ...VW(5,7,5),
      ...HW(3,3,4), ...HW(4,3,4),
      ...HW(3,0,1), ...HW(4,6,7),
    ]
  },
  // 3: off-center 4 nodes — diagonal staircase
  { id:3, grid:8,
    nodes:[{num:1,row:0,col:3},{num:2,row:3,col:7},{num:3,row:7,col:4},{num:4,row:4,col:0}],
    borders:[
      ...HW(1,0,2), ...HW(2,5,7),
      ...VW(1,3,2), ...VW(2,4,4),
      ...HW(5,0,2), ...HW(4,5,7),
      ...VW(4,6,6), ...VW(1,3,5),
    ]
  },
  // 4: 5 nodes — double center pillars
  { id:4, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:3,col:3},{num:3,row:0,col:7},{num:4,row:7,col:7},{num:5,row:7,col:0}],
    borders:[
      ...VW(0,3,3), ...VW(4,7,4),
      ...HW(0,1,2), ...HW(7,5,6),
      ...HW(3,5,7), ...HW(4,0,2),
      ...VW(0,2,5), ...VW(5,7,2),
    ]
  },
  // 5: 5 nodes — inner cross
  { id:5, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:0,col:4},{num:3,row:4,col:7},{num:4,row:7,col:3},{num:5,row:3,col:0}],
    borders:[
      ...HW(1,2,5), ...HW(6,2,5),
      ...VW(2,5,2), ...VW(2,5,5),
      ...HW(3,3,5), ...HW(4,2,4),
    ]
  },
  // 6: 5 nodes — L-shape walls
  { id:6, grid:8,
    nodes:[{num:1,row:2,col:0},{num:2,row:0,col:5},{num:3,row:5,col:7},{num:4,row:7,col:2},{num:5,row:4,col:4}],
    borders:[
      ...HW(1,0,2), ...HW(1,6,7),
      ...VW(2,5,3), ...VW(2,5,6),
      ...HW(3,4,5),
      ...HW(6,0,2), ...HW(6,5,7),
      ...VW(0,2,1), ...VW(5,7,5),
    ]
  },
  // 7: 6 nodes — pinwheel
  { id:7, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:2,col:7},{num:3,row:5,col:5},{num:4,row:7,col:7},{num:5,row:7,col:0},{num:6,row:4,col:2}],
    borders:[
      ...HW(1,2,5), ...HW(6,2,6),
      ...VW(1,3,3), ...VW(4,6,5),
      ...HW(3,0,2), ...HW(4,5,7),
      ...VW(0,2,6), ...VW(5,7,1),
    ]
  },
  // 8: 6 nodes — small checkers
  { id:8, grid:8,
    nodes:[{num:1,row:0,col:1},{num:2,row:1,col:6},{num:3,row:4,col:7},{num:4,row:7,col:5},{num:5,row:6,col:0},{num:6,row:3,col:3}],
    borders:[
      ...HW(2,0,2), ...HW(2,4,6),
      ...HW(5,1,3), ...HW(5,5,7),
      ...VW(2,4,4), ...VW(3,5,2),
      ...HW(3,5,6), ...HW(4,0,2),
    ]
  },
  // 9: 5 nodes — T-bars
  { id:9, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:0,col:7},{num:3,row:4,col:4},{num:4,row:7,col:0},{num:5,row:7,col:7}],
    borders:[
      ...HW(2,0,3), ...HW(2,4,7),
      ...VW(0,3,3), ...VW(0,3,4),
      ...HW(5,0,3), ...HW(5,4,7),
      ...VW(4,7,3), ...VW(4,7,4),
    ]
  },
  // 10: 5 nodes — side channels
  { id:10, grid:8,
    nodes:[{num:1,row:3,col:0},{num:2,row:0,col:3},{num:3,row:3,col:7},{num:4,row:7,col:4},{num:5,row:5,col:1}],
    borders:[
      ...VW(0,3,2), ...VW(4,7,2),
      ...VW(0,3,5), ...VW(4,7,5),
      ...HW(3,3,4),
      ...HW(1,3,5), ...HW(5,3,5),
    ]
  },
  // 11: 6 nodes — zigzag
  { id:11, grid:8,
    nodes:[{num:1,row:0,col:2},{num:2,row:2,col:5},{num:3,row:5,col:7},{num:4,row:7,col:4},{num:5,row:4,col:1},{num:6,row:7,col:0}],
    borders:[
      ...HW(1,3,6), ...HW(3,0,2),
      ...VW(1,4,4), ...VW(3,6,3),
      ...HW(3,4,6), ...HW(5,0,3),
      ...VW(0,2,1), ...VW(5,7,6),
    ]
  },
  // 12: 5 nodes — rooms
  { id:12, grid:8,
    nodes:[{num:1,row:1,col:0},{num:2,row:0,col:6},{num:3,row:3,col:4},{num:4,row:6,col:7},{num:5,row:7,col:1}],
    borders:[
      ...HW(2,1,3), ...HW(2,4,6),
      ...VW(2,4,2), ...VW(2,4,5),
      ...HW(4,0,2), ...HW(5,4,6),
      ...VW(4,6,3), ...VW(0,2,4),
    ]
  },
  // 13: 6 nodes — side fences
  { id:13, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:2,col:3},{num:3,row:0,col:7},{num:4,row:5,col:5},{num:5,row:7,col:7},{num:6,row:5,col:2}],
    borders:[
      ...VW(0,3,1), ...VW(4,7,1),
      ...VW(0,3,6), ...VW(4,7,6),
      ...HW(3,2,5),
      ...HW(1,2,4), ...HW(5,3,5),
    ]
  },
  // 14: 6 nodes — asymmetric
  { id:14, grid:8,
    nodes:[{num:1,row:7,col:0},{num:2,row:4,col:2},{num:3,row:0,col:1},{num:4,row:2,col:6},{num:5,row:7,col:7},{num:6,row:5,col:4}],
    borders:[
      ...HW(1,2,5), ...HW(6,2,5),
      ...VW(1,4,3), ...VW(3,6,5),
      ...HW(3,0,2), ...HW(4,5,7),
    ]
  },
  // 15: 6 nodes — pinwheel B
  { id:15, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:0,col:5},{num:3,row:3,col:7},{num:4,row:7,col:7},{num:5,row:7,col:0},{num:6,row:4,col:2}],
    borders:[
      ...HW(1,2,4), ...HW(2,0,2),
      ...VW(2,5,4), ...VW(3,6,2),
      ...HW(4,4,7), ...HW(5,4,6),
      ...VW(0,3,6), ...VW(4,7,5),
    ]
  },
  // 16: 6 nodes — symmetric border
  { id:16, grid:8,
    nodes:[{num:1,row:1,col:2},{num:2,row:1,col:5},{num:3,row:4,col:7},{num:4,row:6,col:5},{num:5,row:6,col:2},{num:6,row:4,col:0}],
    borders:[
      ...HW(2,0,1), ...HW(2,6,7),
      ...HW(5,0,1), ...HW(5,6,7),
      ...VW(2,5,3), ...VW(2,5,4),
      ...HW(3,3,4), ...HW(4,3,4),
    ]
  },
  // 17: 5 nodes — diagonal bars
  { id:17, grid:8,
    nodes:[{num:1,row:0,col:4},{num:2,row:2,col:7},{num:3,row:7,col:6},{num:4,row:7,col:1},{num:5,row:2,col:0}],
    borders:[
      ...HW(1,1,4), ...HW(3,3,6),
      ...VW(0,3,2), ...VW(0,3,5),
      ...HW(5,1,4), ...VW(4,7,3),
      ...HW(2,2,4), ...HW(6,3,5),
    ]
  },
  // 18: 6 nodes — inner ring
  { id:18, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:3,col:3},{num:3,row:3,col:6},{num:4,row:0,col:7},{num:5,row:7,col:7},{num:6,row:7,col:0}],
    borders:[
      ...VW(0,2,1), ...VW(0,2,6),
      ...VW(5,7,1), ...VW(5,7,6),
      ...HW(2,2,5), ...HW(5,2,5),
      ...VW(2,5,2), ...VW(2,5,5),
    ]
  },
  // 19: 6 nodes — S-curve
  { id:19, grid:8,
    nodes:[{num:1,row:0,col:0},{num:2,row:2,col:4},{num:3,row:5,col:2},{num:4,row:5,col:6},{num:5,row:7,col:4},{num:6,row:7,col:0}],
    borders:[
      ...HW(1,2,5), ...VW(1,3,2),
      ...VW(3,6,4), ...HW(4,3,6),
      ...HW(3,0,2), ...HW(6,1,4),
      ...VW(4,6,5),
    ]
  },
  // 20: 6 nodes — complex inner maze
  { id:20, grid:8,
    nodes:[{num:1,row:1,col:1},{num:2,row:1,col:4},{num:3,row:4,col:6},{num:4,row:6,col:3},{num:5,row:3,col:1},{num:6,row:6,col:7}],
    borders:[
      ...HW(2,0,2), ...HW(2,5,7),
      ...VW(2,5,3), ...VW(2,5,5),
      ...HW(5,0,2), ...HW(5,5,7),
      ...VW(0,2,2), ...VW(5,7,4),
    ]
  },
];

// ===================== GAME STATE =====================
let puzzle    = null;
let currentTarget = 1;
let path      = [];          // [{row, col}, ...]
let filledCells = new Set(); // "row,col"
let nodeMap   = {};          // "row,col" -> node num
let wallSet   = new Set();   // "row,col,right|bottom" canonical form
let isDragging = false;

// ===================== UTILS =====================
function key(r, c) { return r + ',' + c; }
function getCell(r, c) {
  return document.querySelector('#grid .cell[data-r="' + r + '"][data-c="' + c + '"]');
}
function isAdjacent(a, b) {
  return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
}

// Build canonical wall set from borders array
function buildWallSet(p) {
  wallSet = new Set();
  if (!p.borders) return;
  p.borders.forEach(b => {
    let { row, col, side } = b;
    if (side === 'top'   && row > 0) { row -= 1; side = 'bottom'; }
    if (side === 'left'  && col > 0) { col -= 1; side = 'right';  }
    if (side === 'bottom' && row < 7) wallSet.add(row + ',' + col + ',bottom');
    if (side === 'right'  && col < 7) wallSet.add(row + ',' + col + ',right');
  });
}

// Returns true if there is a wall blocking movement from (r1,c1) to (r2,c2)
function isWallBetween(r1, c1, r2, c2) {
  if (r1 === r2) {
    // Horizontal move
    const minC = Math.min(c1, c2);
    return wallSet.has(r1 + ',' + minC + ',right');
  } else {
    // Vertical move
    const minR = Math.min(r1, r2);
    return wallSet.has(minR + ',' + c1 + ',bottom');
  }
}

// ===================== SCREEN MANAGEMENT =====================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===================== PUZZLE INIT =====================
function startPuzzle(p) {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  document.querySelectorAll('#grid .cell.hint-show').forEach(c => c.classList.remove('hint-show'));
  const hintBtn = document.getElementById('btn-hint');
  if (hintBtn) { hintBtn.disabled = false; hintBtn.textContent = '💡 ヒント'; }
  puzzle = p;
  currentTarget = 1;
  path = [];
  filledCells = new Set();
  nodeMap = {};
  p.nodes.forEach(n => { nodeMap[key(n.row, n.col)] = n.num; });
  buildWallSet(p);
  document.getElementById('clear-overlay').classList.remove('show');
  renderGrid();
  showScreen('screen-game');
}

function randomPuzzle() {
  return PUZZLES[Math.floor(Math.random() * PUZZLES.length)];
}
function differentPuzzle() {
  if (PUZZLES.length <= 1) return PUZZLES[0];
  let p;
  do { p = PUZZLES[Math.floor(Math.random() * PUZZLES.length)]; } while (p === puzzle);
  return p;
}

// ===================== RENDER =====================
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      const nodeNum = nodeMap[key(r, c)];
      if (nodeNum !== undefined) {
        const circle = document.createElement('div');
        circle.className = 'node-circle';
        circle.textContent = nodeNum;
        cell.appendChild(circle);
        if (nodeNum === currentTarget) cell.classList.add('current-target');
      }
      grid.appendChild(cell);
    }
  }
  redrawPath();
  // Render walls after layout is computed
  requestAnimationFrame(renderWalls);
}

function renderWalls() {
  const grid = document.getElementById('grid');
  grid.querySelectorAll('.game-wall').forEach(el => el.remove());
  if (!puzzle || !puzzle.borders || puzzle.borders.length === 0) return;

  const firstCell = grid.querySelector('.cell');
  if (!firstCell) return;
  const cellPx = firstCell.offsetWidth;
  const stride  = cellPx + 2; // cell + 2px gap
  const THICK   = 4;

  // Split wallSet into right/bottom lookup sets
  const rw = new Set(), bw = new Set();
  wallSet.forEach(w => {
    const p    = w.lastIndexOf(',');
    const side = w.slice(p + 1);
    const rc   = w.slice(0, p);
    if (side === 'right') rw.add(rc); else bw.add(rc);
  });

  function makeWall(left, top, width, height) {
    const el = document.createElement('div');
    el.className = 'game-wall';
    el.style.left   = left   + 'px';
    el.style.top    = top    + 'px';
    el.style.width  = width  + 'px';
    el.style.height = height + 'px';
    grid.appendChild(el);
  }

  // Merge consecutive right-wall rows → single vertical div
  const doneR = new Set();
  for (let c = 0; c < 7; c++) {
    for (let r = 0; r < 7; r++) {
      const k = r + ',' + c;
      if (!rw.has(k) || doneR.has(k)) continue;
      let eR = r;
      while (eR + 1 < 7 && rw.has((eR + 1) + ',' + c)) eR++;
      for (let i = r; i <= eR; i++) doneR.add(i + ',' + c);
      makeWall(
        c * stride + cellPx - 1,   // 1px inside right edge of cell
        r * stride,
        THICK,
        (eR - r) * stride + cellPx  // spans cells r..eR (including inter-cell gaps)
      );
    }
  }

  // Merge consecutive bottom-wall cols → single horizontal div
  const doneB = new Set();
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 7; c++) {
      const k = r + ',' + c;
      if (!bw.has(k) || doneB.has(k)) continue;
      let eC = c;
      while (eC + 1 < 7 && bw.has(r + ',' + (eC + 1))) eC++;
      for (let i = c; i <= eC; i++) doneB.add(r + ',' + i);
      makeWall(
        c * stride,
        r * stride + cellPx - 1,   // 1px inside bottom edge of cell
        (eC - c) * stride + cellPx, // spans cells c..eC
        THICK
      );
    }
  }
}

function redrawPath() {
  document.querySelectorAll('#grid .cell').forEach(cell => {
    cell.classList.remove('filled', 'filled-node', 'current-target', 'hint-show');
    cell.querySelectorAll('.path-line').forEach(el => el.remove());
  });

  // Highlight current target node
  const tNode = puzzle.nodes.find(n => n.num === currentTarget);
  if (tNode) {
    const tc = getCell(tNode.row, tNode.col);
    if (tc) tc.classList.add('current-target');
  }

  path.forEach((pos, i) => {
    const cell = getCell(pos.row, pos.col);
    if (!cell) return;
    const isNodeCell = nodeMap[key(pos.row, pos.col)] !== undefined;
    cell.classList.add(isNodeCell ? 'filled-node' : 'filled');

    const prev = path[i - 1];
    const next = path[i + 1];
    const lines = [];
    if (prev) {
      const dr = prev.row - pos.row, dc = prev.col - pos.col;
      if      (dc ===  1) lines.push('half-r');
      else if (dc === -1) lines.push('half-l');
      else if (dr ===  1) lines.push('half-d');
      else if (dr === -1) lines.push('half-u');
    }
    if (next) {
      const dr = next.row - pos.row, dc = next.col - pos.col;
      if      (dc ===  1) lines.push('half-r');
      else if (dc === -1) lines.push('half-l');
      else if (dr ===  1) lines.push('half-d');
      else if (dr === -1) lines.push('half-u');
    }
    const hasR = lines.includes('half-r'), hasL = lines.includes('half-l');
    const hasD = lines.includes('half-d'), hasU = lines.includes('half-u');
    if      (hasR && hasL) addLine(cell, 'h');
    else if (hasU && hasD) addLine(cell, 'v');
    else {
      if (hasR) addLine(cell, 'half-r');
      if (hasL) addLine(cell, 'half-l');
      if (hasD) addLine(cell, 'half-d');
      if (hasU) addLine(cell, 'half-u');
    }
  });
  updateProgress();
}

function updateProgress() {
  const el = document.getElementById('progress-counter');
  if (!el) return;
  el.textContent = filledCells.size + ' / 64';
  el.classList.remove('hint-fail');
  el.style.color = '';
}

function addLine(cell, cls) {
  const line = document.createElement('div');
  line.className = 'path-line ' + cls;
  cell.appendChild(line);
}

// ===================== INTERACTION =====================
function getCellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const cell = el.closest('.cell');
  if (!cell) return null;
  return { row: parseInt(cell.dataset.r), col: parseInt(cell.dataset.c) };
}

function tryMove(r, c) {
  const k = key(r, c);

  if (path.length === 0) {
    const tNode = puzzle.nodes.find(n => n.num === currentTarget);
    if (!tNode || tNode.row !== r || tNode.col !== c) return;
    path.push({ row: r, col: c });
    filledCells.add(k);
    redrawPath();
    return;
  }

  const last = path[path.length - 1];
  if (last.row === r && last.col === c) return;
  if (!isAdjacent(last, { row: r, col: c })) return;

  // Backtrack: moving to second-to-last in path
  if (path.length >= 2) {
    const prev = path[path.length - 2];
    if (prev.row === r && prev.col === c) {
      const removed = path.pop();
      const removedKey = key(removed.row, removed.col);
      filledCells.delete(removedKey);
      const removedNodeNum = nodeMap[removedKey];
      if (removedNodeNum !== undefined && removedNodeNum === currentTarget && removedNodeNum > 1) {
        currentTarget--;
      }
      redrawPath();
      return;
    }
  }

  // Wall check
  if (isWallBetween(last.row, last.col, r, c)) return;

  // Revisit check
  if (filledCells.has(k)) return;

  // Node check
  const nodeNum = nodeMap[k];
  if (nodeNum !== undefined) {
    if (nodeNum !== currentTarget + 1) return;
    path.push({ row: r, col: c });
    filledCells.add(k);
    currentTarget++;
    redrawPath();
    checkClear();
    return;
  }

  path.push({ row: r, col: c });
  filledCells.add(k);
  redrawPath();
  checkClear();
}

function checkClear() {
  if (currentTarget >= puzzle.nodes.length && filledCells.size === 64) {
    document.getElementById('clear-overlay').classList.add('show');
  }
}

function resetPuzzle() {
  currentTarget = 1;
  path = [];
  filledCells = new Set();
  document.getElementById('clear-overlay').classList.remove('show');
  redrawPath();
}

// ===================== HINT (DFS SOLVER) =====================
let hintTimer = null;

function computeHint() {
  if (path.length === 0) {
    const n1 = puzzle.nodes.find(n => n.num === 1);
    return n1 ? { row: n1.row, col: n1.col } : null;
  }

  const deadline   = Date.now() + 1500;
  const last       = path[path.length - 1];
  const visited    = new Set(filledCells);
  const totalNodes = puzzle.nodes.length;
  const BASE_DIRS  = [[0,1],[0,-1],[1,0],[-1,0]];

  function dfs(r, c, curTarget, firstStep) {
    if (Date.now() > deadline) return null;
    if (visited.size === 64 && curTarget >= totalNodes) return firstStep;

    // Sort moves toward the next target node (Manhattan heuristic)
    const nextN = curTarget < totalNodes
      ? puzzle.nodes.find(n => n.num === curTarget + 1) : null;
    const dirs = nextN
      ? BASE_DIRS.slice().sort((a, b) => {
          const dA = Math.abs(r + a[0] - nextN.row) + Math.abs(c + a[1] - nextN.col);
          const dB = Math.abs(r + b[0] - nextN.row) + Math.abs(c + b[1] - nextN.col);
          return dA - dB;
        })
      : BASE_DIRS;

    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) continue;
      if (isWallBetween(r, c, nr, nc)) continue;
      const nk = key(nr, nc);
      if (visited.has(nk)) continue;
      const nodeNum = nodeMap[nk];
      if (nodeNum !== undefined && nodeNum !== curTarget + 1) continue;
      const newTarget = nodeNum !== undefined ? curTarget + 1 : curTarget;
      const step = firstStep || { row: nr, col: nc };
      visited.add(nk);
      const result = dfs(nr, nc, newTarget, step);
      visited.delete(nk);
      if (result !== null) return result;
    }
    return null;
  }

  const hint = dfs(last.row, last.col, currentTarget, null);
  if (hint) return hint;

  // BFS fallback: find shortest path to next target node
  const nextNode = puzzle.nodes.find(n => n.num === currentTarget + 1);
  if (!nextNode) {
    // Past last node — suggest any unvisited adjacent cell
    for (const [dr, dc] of BASE_DIRS) {
      const nr = last.row + dr, nc = last.col + dc;
      if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) continue;
      if (isWallBetween(last.row, last.col, nr, nc)) continue;
      if (!visited.has(key(nr, nc))) return { row: nr, col: nc };
    }
    return null;
  }
  const queue = [[last.row, last.col]];
  const parent = new Map();
  const startK = key(last.row, last.col);
  parent.set(startK, null);
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [dr, dc] of BASE_DIRS) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) continue;
      if (isWallBetween(r, c, nr, nc)) continue;
      const nk = key(nr, nc);
      if (visited.has(nk) || parent.has(nk)) continue;
      const nodeNum = nodeMap[nk];
      if (nodeNum !== undefined && nodeNum !== currentTarget + 1) continue;
      parent.set(nk, key(r, c));
      if (nr === nextNode.row && nc === nextNode.col) {
        let cur = nk;
        while (parent.get(cur) !== startK) cur = parent.get(cur);
        const [fr, fc] = cur.split(',').map(Number);
        return { row: fr, col: fc };
      }
      queue.push([nr, nc]);
    }
  }
  return null;
}

function showHint() {
  if (!puzzle) return;
  const btn = document.getElementById('btn-hint');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.textContent = '💡 計算中...';
  // Double rAF ensures the browser paints the disabled state before the blocking DFS
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const hint = computeHint();
    btn.disabled = false;
    btn.textContent = '💡 ヒント';
    if (!hint) {
      const el = document.getElementById('progress-counter');
      if (el) {
        el.textContent = 'ヒントが見つかりません';
        el.classList.add('hint-fail');
        setTimeout(() => updateProgress(), 2000);
      }
      return;
    }
    if (hintTimer) clearTimeout(hintTimer);
    document.querySelectorAll('#grid .cell.hint-show').forEach(c => c.classList.remove('hint-show'));
    const cell = getCell(hint.row, hint.col);
    if (!cell) return;
    cell.classList.add('hint-show');
    hintTimer = setTimeout(() => cell.classList.remove('hint-show'), 2000);
  }));
}

// ===================== EVENT LISTENERS =====================
document.getElementById('btn-play').addEventListener('click', () => {
  startPuzzle(randomPuzzle());
});
document.getElementById('btn-back').addEventListener('click', () => {
  showScreen('screen-title');
});
document.getElementById('btn-undo').addEventListener('click', resetPuzzle);
document.getElementById('btn-hint').addEventListener('click', showHint);

document.getElementById('btn-retry').addEventListener('click', () => {
  startPuzzle(puzzle);
});
document.getElementById('btn-different').addEventListener('click', () => {
  startPuzzle(differentPuzzle());
});

// Mouse events
const gridEl = document.getElementById('grid');

gridEl.addEventListener('mousedown', e => {
  const pos = getCellFromPoint(e.clientX, e.clientY);
  if (!pos) return;
  isDragging = true;
  tryMove(pos.row, pos.col);
});
gridEl.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const pos = getCellFromPoint(e.clientX, e.clientY);
  if (!pos) return;
  tryMove(pos.row, pos.col);
});
document.addEventListener('mouseup', () => { isDragging = false; });

// Touch events
gridEl.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const pos = getCellFromPoint(t.clientX, t.clientY);
  if (!pos) return;
  isDragging = true;
  tryMove(pos.row, pos.col);
}, { passive: false });
gridEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDragging) return;
  const t = e.touches[0];
  const pos = getCellFromPoint(t.clientX, t.clientY);
  if (!pos) return;
  tryMove(pos.row, pos.col);
}, { passive: false });
gridEl.addEventListener('touchend',   () => { isDragging = false; });
gridEl.addEventListener('touchcancel', () => { isDragging = false; });

// Re-render walls on resize (cell sizes may change on mobile)
window.addEventListener('resize', () => { if (puzzle) renderWalls(); });
</script>
